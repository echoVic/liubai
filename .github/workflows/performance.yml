name: Performance

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Performance
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check performance
        run: bun scripts/check-performance.ts
        env:
          # Double the budgets for slower, noisier shared CI runners.
          PERF_BUDGET_SCALE: 2
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check resources
        run: go test -run 'TestStartupBundleStaysSmall|TestFrontendShipsAsResource' .
