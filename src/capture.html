<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src &#x27;self&#x27;; script-src &#x27;self&#x27;; style-src &#x27;self&#x27; &#x27;unsafe-inline&#x27;; connect-src &#x27;self&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;"><title data-i18n="fQuickNoteLiubai">Quick Note · Liubai</title><script src="boot.js"></script><link rel="stylesheet" href="capture.css"><script type="module" src="capture.js"></script></head><body>
<main class="capture">
 <header>
  <label class="destination"><span data-i18n="fCaptureDestination">Save to</span><select id="capture-target"><option value="" data-i18n="fCaptureNewDraft">New Draft</option></select></label>
  <label><span data-i18n="fCaptureTemplate">Template</span><select id="capture-template"><option value="" data-i18n="fCapturePlain">Plain Note</option><option value="task" data-i18n="fCaptureTask">To-do</option><option value="meeting" data-i18n="fCaptureMeeting">Meeting</option><option value="idea" data-i18n="fCaptureIdea">Idea</option></select></label>
 </header>
 <textarea id="capture-text" aria-label="Quick Note" placeholder="Capture this moment…" autofocus spellcheck="false" data-i18n-aria-label="fQuickNote" data-i18n-placeholder="fCaptureThisMoment"></textarea>
 <label class="tags"><span data-i18n="fCaptureTags">Tags</span><input id="capture-tags" type="text" placeholder="Separate tags with commas" data-i18n-placeholder="fCaptureTagsHint" autocomplete="off" spellcheck="false"></label>
 <footer><span id="capture-status" role="status" aria-live="polite" data-i18n="fCaptureSaveHint" data-shortcut="Mod+Enter">⌘↩ Save · Esc Close</span><button id="capture-save" data-i18n="fSaveAsDraft">Save as Draft</button></footer>
</main></body></html>
