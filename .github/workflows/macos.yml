name: macOS

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: checks, performance and web/ freshness
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check performance
        run: bun scripts/check-performance.ts
        env:
          # Double the budgets for slower, noisier shared CI runners.
          PERF_BUDGET_SCALE: 2
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check resources
        run: go test -run 'TestStartupBundleStaysSmall|TestFrontendShipsAsResource' .
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # tsc, check-i18n, check-themes and every scripts/check-*.ts except check-performance (run above).
      - name: Headless checks
        run: bun run check:headless
      # web/ is committed build output; a source change committed without a rebuild fails here.
      - name: Check web/ matches src/
        run: |
          node scripts/build.mjs
          if ! git diff --exit-code --stat -- web; then
            echo "::error::web/ is out of date: run node scripts/build.mjs and commit web/"
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- web)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::the build added files under web/ that are not committed"
            exit 1
          fi
