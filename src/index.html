<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>留白</title><script src="boot.js"></script><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<header class="topbar"><button class="brand" data-action="recent" title="最近文稿"><span class="brand-mark">白</span><span>留白</span></button><div class="doc-heading"><button id="doc-title" data-action="rename" title="为草稿命名">未命名文稿</button><span id="save-status" role="status">正在打开</span></div><div class="top-actions"><button class="tool" data-action="new" title="新建文稿 ⌘N" aria-label="新建文稿" data-icon="new"></button><button class="tool" data-action="outline" title="文稿大纲" aria-label="文稿大纲" data-icon="outline"></button><button class="mode-toggle" data-action="layout" id="mode-button" title="切换主布局"><span data-icon="preview"></span><span id="mode-label">即时排版</span></button><button class="tool" data-action="read" title="阅读模式 ⌘⇧R" aria-label="阅读模式" aria-pressed="false" data-icon="read"></button><button class="tool" data-action="theme" title="外观" aria-label="外观与排版" data-icon="theme"></button><button class="tool" data-action="focus" aria-label="段落专注" title="段落专注 ⌘⇧F" data-icon="focus"></button><button class="take-away" data-action="deliver">带走文稿</button><button class="tool" data-action="commands" title="操作搜索 ⌘K" aria-label="所有操作" data-icon="commands"></button></div></header>
<div id="banner" role="alert" hidden><span id="banner-text"></span><button data-action="retry">重试保存</button><button data-action="saveAs">另存</button><button id="reload-disk" data-action="reload" hidden>查看磁盘版本</button><button id="overwrite-disk" data-action="overwrite" hidden>用当前版本覆盖</button><button id="reveal-quarantine" hidden>在 Finder 中显示</button></div>
<main class="desk"><div class="desk-caption"><span id="document-kind">此刻 · 一篇草稿</span><button data-action="commands">所有操作 <kbd>⌘ K</kbd></button></div><section class="editor-pane" aria-label="编辑区"><article class="paper"><div class="paper-top"><span class="paper-eyebrow">让一句话，有时间抵达。</span><div class="paper-actions"><button id="source-button" class="source-toggle" data-action="source" title="切换左侧编辑方式"><span data-icon="source"></span><span id="source-label">即时</span></button><button class="tool" data-action="image" title="插入图片" aria-label="插入图片" data-icon="image"></button></div></div><nav id="format-bar" aria-label="格式工具栏"></nav><div id="editor" aria-label="文稿编辑区"></div><div class="paper-bottom"><span>写下这一刻。</span><span id="word-count">0 字</span></div></article></section><section id="preview" aria-label="阅读预览" hidden><header class="preview-head"><span>阅读视图</span><span class="preview-pill">只读</span></header><div class="preview-scroll" tabindex="0"><div id="preview-content"></div></div></section><div class="desk-bottom"><span id="workspace-label">文稿留在本机</span><span>自动草稿 · 随时续写</span></div></main>
<aside id="drawer" class="drawer" hidden><div class="drawer-head"><h2 id="drawer-title">最近文稿</h2><button class="tool" data-close="drawer" aria-label="关闭侧栏">×</button></div><input id="recent-search" type="search" placeholder="找一篇文稿…" aria-label="搜索最近文稿"><div id="drawer-list"></div><button class="drawer-open" data-action="open">打开本地 Markdown <kbd>⌘ O</kbd></button></aside>
<dialog id="appearance" aria-label="外观与主题"><div class="dialog-head"><div><span class="eyebrow">适合此刻的颜色</span><h2>外观</h2></div><button class="tool" data-close="appearance" aria-label="关闭外观">×</button></div><div id="themes" role="radiogroup" aria-label="主题"></div><label class="follow"><div><b>跟随系统</b><small>浅色用纸白，深色用夜墨</small></div><input id="follow-system" type="checkbox" role="switch"></label><div class="type-settings"><label>字号<select id="font-size" aria-label="正文字号"><option value="16">16</option><option value="18">18</option><option value="20">20</option><option value="22">22</option></select></label><label>行宽<select id="line-width" aria-label="正文行宽"><option value="normal">舒适</option><option value="wide">宽阔</option></select></label></div><p class="dialog-note">选择即应用。你的文稿和编辑位置会保持原样。</p></dialog>
<dialog id="rename-dialog" aria-label="为草稿命名"><form id="rename-form"><h2>给这一页一个名字</h2><input id="rename-input" aria-label="文稿名称" maxlength="100" required><div class="dialog-actions"><button type="button" data-close="rename-dialog">取消</button><button type="submit">保存名称</button></div></form></dialog>
<dialog id="commands" aria-label="操作搜索"><input id="command-search" type="search" placeholder="搜索操作、主题…" aria-label="搜索操作"><div id="command-list"></div><div class="command-foot"><span>直接写，也可以用快捷键</span><kbd>esc 关闭</kbd></div></dialog>
<dialog id="close-dialog" aria-label="文稿保存未完成"><h2>先把这一页留住</h2><p>最新修改还没有保存到草稿，当前内容仍在编辑器里。</p><div class="dialog-actions"><button data-close="close-dialog">继续编辑</button><button data-action="retry-close">重试并退出</button><button data-action="rescue">保存当前副本</button><button id="discard-close" class="danger">放弃未保存修改并退出</button></div></dialog>
<dialog id="missing-dialog" aria-label="图片缺失"><h2>有几张图片没有找到</h2><p id="missing-list"></p><div class="dialog-actions"><button data-close="missing-dialog">返回处理</button><button id="export-anyway">保留原引用继续打包</button></div></dialog>
<dialog id="link-dialog" aria-label="编辑链接"><form id="link-form"><div class="dialog-head"><h2>链接</h2><button type="button" class="tool" data-close="link-dialog" aria-label="关闭链接面板" data-icon="close"></button></div><label class="field-label">显示文字<input id="link-text" required aria-label="链接文字"></label><label class="field-label">链接地址<input id="link-url" required placeholder="https:// 或 #标题" aria-label="链接地址"></label><p id="link-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="link-open">打开链接</button><button type="button" id="link-remove">移除链接</button><button type="submit">应用链接</button></div></form></dialog>
<dialog id="table-dialog" aria-label="编辑表格"><form id="table-form"><div class="dialog-head"><h2>编辑表格</h2><button type="button" class="tool" data-close="table-dialog" aria-label="关闭表格面板" data-icon="close"></button></div><p class="dialog-note">第一行是表头。用 Tab 切换单元格，应用后可撤销整次修改。</p><div id="table-grid"></div><div class="dialog-actions"><button type="button" id="table-row">增加一行</button><button type="button" id="table-column">增加一列</button><button type="submit">应用表格</button></div></form></dialog>
<dialog id="delivery-dialog" aria-label="带走文稿"><div class="dialog-head"><h2>带走这一页</h2><button class="tool" data-close="delivery-dialog" aria-label="关闭交付面板" data-icon="close"></button></div><div class="delivery-options"><button data-deliver="saveAs"><b>保存 Markdown</b><small>普通 .md 文件，继续编辑</small></button><button data-deliver="export"><b>文稿与图片 ZIP</b><small>本地图片一起带走</small></button><button data-deliver="pdf"><b>导出 PDF</b><small>完整排版，适合阅读与发送</small></button><button data-deliver="copyRich"><b>复制富文本</b><small>粘贴到邮件或文档，保留基本格式</small></button><button data-deliver="html"><b>下载 HTML</b><small>内嵌本地图片，离线阅读</small></button></div><p class="dialog-note">外链图片保留链接；富文本图片显示取决于接收应用。</p></dialog>
<dialog id="ready-dialog" aria-label="文稿已准备"><h2>文稿已准备好</h2><p id="ready-info"></p><div class="dialog-actions"><button data-close="ready-dialog">返回编辑</button><button id="ready-go">继续</button></div></dialog>
<button id="focus-exit" data-action="focus" hidden>退出专注 <kbd>Esc</kbd></button><div id="print-document" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" hidden></div><input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/avif,image/bmp" multiple hidden><input id="open-input" type="file" accept=".md,.markdown,.txt" hidden>
</body></html>
