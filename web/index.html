<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>留白</title><script src="boot.js"></script><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<header class="topbar"><button class="brand" data-action="recent" title="最近文稿"><span class="brand-mark">白</span><span>留白</span></button><div class="doc-heading"><button id="doc-title" data-action="rename" title="为草稿命名">未命名文稿</button><span id="save-status" role="status">正在打开</span></div><div class="top-actions"><button class="tool" data-action="new" title="新建文稿 ⌘N">＋</button><button class="tool" data-action="outline" title="文稿大纲">☷</button><button class="tool" data-action="source" id="mode-button" title="查看 Markdown 源码">〈/〉</button><button class="tool" data-action="theme" aria-label="外观与主题" title="外观">◐</button><button class="take-away" data-action="saveAs">保存文稿 <span>↗</span></button><button class="tool" data-action="commands" title="操作搜索 ⌘K">⋯</button></div></header>
<div id="banner" role="alert" hidden><span id="banner-text"></span><button data-action="retry">重试保存</button><button data-action="saveAs">另存</button><button id="reload-disk" data-action="reload" hidden>查看磁盘版本</button></div>
<main class="desk"><div class="desk-caption"><span id="document-kind">此刻 · 一篇草稿</span><button data-action="commands">所有操作 <kbd>⌘ K</kbd></button></div><article class="paper"><div class="paper-top"><span class="paper-eyebrow">让一句话，有时间抵达。</span><button class="tool" data-action="image" aria-label="插入图片" title="插入图片">▧</button></div><div id="editor" aria-label="文稿编辑区"></div><div class="paper-bottom"><span>写下这一刻。</span><span id="word-count">0 字</span></div></article><div class="desk-bottom"><span id="workspace-label">文稿留在本机</span><span>自动草稿 · 随时续写</span></div></main>
<aside id="drawer" class="drawer" hidden><div class="drawer-head"><h2 id="drawer-title">最近文稿</h2><button class="tool" data-close="drawer" aria-label="关闭侧栏">×</button></div><input id="recent-search" type="search" placeholder="找一篇文稿…" aria-label="搜索最近文稿"><div id="drawer-list"></div><button class="drawer-open" data-action="open">打开本地 Markdown <kbd>⌘ O</kbd></button></aside>
<dialog id="appearance" aria-label="外观与主题"><div class="dialog-head"><div><span class="eyebrow">适合此刻的颜色</span><h2>外观</h2></div><button class="tool" data-close="appearance" aria-label="关闭外观">×</button></div><div id="themes" role="radiogroup" aria-label="主题"></div><label class="follow"><div><b>跟随系统</b><small>浅色用纸白，深色用夜墨</small></div><input id="follow-system" type="checkbox" role="switch"></label><p class="dialog-note">选择即应用。你的文稿和编辑位置会保持原样。</p></dialog>
<dialog id="rename-dialog" aria-label="为草稿命名"><form id="rename-form"><h2>给这一页一个名字</h2><input id="rename-input" aria-label="文稿名称" maxlength="100" required><div class="dialog-actions"><button type="button" data-close="rename-dialog">取消</button><button type="submit">保存名称</button></div></form></dialog>
<dialog id="commands" aria-label="操作搜索"><input id="command-search" type="search" placeholder="搜索操作、主题…" aria-label="搜索操作"><div id="command-list"></div><div class="command-foot"><span>直接写，也可以用快捷键</span><kbd>esc 关闭</kbd></div></dialog>
<dialog id="close-dialog" aria-label="文稿保存未完成"><h2>先把这一页留住</h2><p>最新修改尚未可靠保存，当前内容仍在编辑器里。</p><div class="dialog-actions"><button data-close="close-dialog">继续编辑</button><button data-action="saveAs">另存文稿</button><button id="discard-close" class="danger">放弃未保存修改并退出</button></div></dialog>
<dialog id="missing-dialog" aria-label="图片缺失"><h2>有几张图片没有找到</h2><p id="missing-list"></p><div class="dialog-actions"><button data-close="missing-dialog">返回处理</button><button id="export-anyway">保留原引用继续打包</button></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><input id="image-input" type="file" accept="image/png,image/jpeg,image/gif" multiple hidden><input id="open-input" type="file" accept=".md,.markdown,.txt" hidden>
</body></html>
